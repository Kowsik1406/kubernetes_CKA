# CSR for user kowsik; administrator approves it
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: vigram-csr
spec:
  request: 
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 8640000  #(86400 sec --> 1 day so add more zeros for not expiring )
  usages:
    - digital signature
    - key encipherment
    - client auth