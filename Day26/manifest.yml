# create frontend pod, backend pod and MySQL DB pod and services for all

apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  labels:
    role: frontend
spec:
  containers:
  - name: nginx-container
    image: nginx
    ports:
    - containerPort: 80
      protocol: TCP      #-->It's a communication protocol that allows applications to send data reliably over a network.

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    role: frontend
spec:
  selector:                    #NOTE: service selector and pod labels need to match or same.
    role: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: backend-pod
  labels:
    role: backend
spec:
  containers:
  - name: nginx
    image: nginx
    ports:
    - containerPort: 80
      protocol: TCP 

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    role: backend
spec:
  selector:
    role: backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: mysql
  labels:
    name: mysql
spec:
  containers:
    - name: mysql
      image: mysql:latest
      env:
       - name: "MYSQL_USER"
         value: "mysql"
       - name: "MYSQL_PASSWORD"
         value: "mysql"
       - name: "MYSQL_DATABASE"
         value: "testdb"
       - name: "MYSQL_ROOT_PASSWORD"
         value: "verysecure"
      ports:                          # So we specify the port because MySQL is a network service that listens for database connections on TCP port 3306.
        - name: mysql
          containerPort: 3306
          protocol: TCP

---

apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    name: mysql
spec:
  selector:
    name: mysql
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306

#Traffic flow 

#      Backend Pod
#            |
#            v
#      mysql-service:3306
#            |
#            v
#      mysql Pod:3306
#            |
#            v
#      MySQL Process

