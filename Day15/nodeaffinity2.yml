apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: node-affinity-pod2
  name: node-affinity-pod2
spec:
  containers:
  - image: nginx
    name: node-affinity-pod2
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: disktype
            operator: In
            values:
            - hdd  
status: {}
