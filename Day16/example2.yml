apiVersion: v1
kind: Pod
metadata:
  name: memory-demo2
  namespace: memory-demo
spec:
  containers:
  - name: memory-demo-ctr2
    image: polinux/stress
    resources:
      requests:
        memory: "100Mi"
      limits:
        memory: "200Mi"
    command: ["stress"]
    args: ["--vm","1", "--vm-bytes", "150M", "--vm-hang", "1"]