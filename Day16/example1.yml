apiVersion: v1
kind: Pod
metadata:
  name: memory-demo1
  namespace: mem-example   #instaed of mentioning the namespace in the command line, we can mention it here in the yaml file. which will create the pod in the mentioned namespace.
spec:
  containers:
  - name: memory-demo-ctr1
    image: polinux/stress
    resources:
      requests:
        memory: "50Mi"  #need atleast 50Mi of memory to run the pod. if we try to run the pod with less than 50Mi, it will not be scheduled on any node.
      limits:
        memory: "100Mi" #do not allow the pod to use more than 100Mi of memory. if the pod tries to use more than 100Mi, it will be killed by the kubelet.
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "1"]


#vm --> virtual memory stress test
#1 --> number of workers to spawn
#vm bytes --> amount of memory to allocate per worker ( 200M in this case)
#vm hang --> time in seconds to wait before killing the worker (1 second in this case)


#create a namespace called mem-example
#kubectl apply -f example1.yml
#kubectl get pods -n mem-example or kubectl get pods -n mem-example -o wide
#kubect`l describe pod memory-demo1 -n mem-example ( to see the events and status of the pod)
#kubectl delete pod memory-demo1 -n mem-example (to delete the pod)
#kubectl delete ns mem-example (to delete the namespace)

#polinux/stress is a Docker image that already has the Linux stress tool installed.
#using polinux/stress image to create a pod that will consume memory. This is useful for testing memory limits and requests in Kubernetes. 
#The pod will request 50Mi of memory and will be limited to 100Mi. If it tries to use more than 100Mi, it will be terminated by the kubelet.


